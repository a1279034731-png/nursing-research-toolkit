[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nursing-research-toolkit"
version = "0.1.0"
description = "Small reproducible utilities for nursing and clinical research workflows."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "zw pan"}
]
keywords = ["nursing", "clinical-research", "delphi", "scale-development", "evidence-synthesis"]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[tool.setuptools.packages.find]
where = ["src"]
